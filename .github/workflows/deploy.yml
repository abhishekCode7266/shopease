name: StarShop CI/CD - Build APK, Play Store Bundle & Deploy Web

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  test_and_analyze:
    name: Run Unit Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze || true

      - name: Run Flutter Tests
        run: flutter test

  build_android:
    name: Build Android Release APK & AAB (Google Play Store)
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Android Platform Structure
        run: |
          ls -la android/
          ls -la android/app/
          cat android/settings.gradle.kts

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release App Bundle (AAB for Play Store)
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: starshop-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB (Play Store) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: starshop-playstore-aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Create GitHub Release with APK & AAB
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || startsWith(github.ref, 'refs/heads/master')
        with:
          tag_name: v2.0.0
          name: StarShop v2.0.0 (Enterprise Multi-Role & Developer Bypass Release)
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## StarShop v2.0.0 Enterprise Multi-Role Release 🎉
            
            Welcome to **StarShop**, an enterprise-grade Flutter E-Commerce mobile & web application featuring comprehensive multi-role governance (Customer, Seller Hub, Super Admin), full Developer Bypass (PIN: `7266`), and an integrated AI Concierge Assistant!
            
            ### 📱 Download & Install:
            - **Download Android Release APK**: [`app-release.apk`](https://github.com/${{ github.repository }}/releases/download/v2.0.0/app-release.apk)
            - **Google Play Store App Bundle**: [`app-release.aab`](https://github.com/${{ github.repository }}/releases/download/v2.0.0/app-release.aab)
            - **Web Live Application**: [https://abhishekCode7266.github.io/starshop/](https://abhishekCode7266.github.io/starshop/)
            - **Live Updates RSS Feed**: [https://abhishekCode7266.github.io/starshop/feed.xml](https://abhishekCode7266.github.io/starshop/feed.xml)
            
            ### ✨ Core Features & Sections:
            1. **Customer Web & Mobile Experience:**
               - Hero banners, category tabs, real-time search, price/rating/stock filters & sorting.
               - Product details with video previews, technical specs comparison, and customer reviews.
               - Wishlist management and recently viewed history carousel.
            2. **Cart & Smart Checkout:**
               - Dynamic quantity controls, 18% GST (CGST 9% + SGST 9%) breakdown.
               - Coupon & Promo engine (`WELCOME50`, `EASE20`, `FREESHIP`, `FESTIVE10`).
               - Saved delivery address picker with default address preference.
            3. **Multi-Payment Gateway Integration:**
               - UPI Transfers (PhonePe, Google Pay, Paytm, BHIM).
               - Credit & Debit Cards (Visa, MasterCard, RuPay).
               - Net Banking (HDFC, SBI, ICICI, Axis, Kotak).
               - Cash on Delivery (COD) with verification.
            4. **Live Order Management & Compliance:**
               - Real-time milestone tracker (Confirmed -> Packed -> Shipped -> Out for Delivery -> Delivered).
               - BlueDart / Delhivery carrier tracking with AWB numbers.
               - Official Tax Invoice generation with GSTIN details and PDF download.
               - Self-service cancellation and 7-day return / refund workflow.
            5. **Seller Merchant Hub:**
               - Add / Edit product catalog with live inventory counters.
               - Order dispatch management and status updates.
               - Monthly earnings, settlement ledger, and sales export reports.
            6. **Super Admin Platform Central:**
               - Platform gross revenue & 20% commission analytics.
               - Interactive monthly sales progression chart (Jan - Dec).
               - Merchant KYC & application verification queue.
               - Customer account moderation & security suspensions.
               - Platform-wide broadcast notification dispatcher.
            7. **StarShop AI Assistant Concierge:**
               - Contextual shopping recommendations powered by catalog awareness.
               - Live order tracking assistance and return policy inquiries.
            8. **Developer Mode Bypass (डेवलपर मोड बाईपास):**
               - Circular settings icon & PIN `7266` instant authentication.
               - One-click role switching between Customer, Seller, and Super Admin.
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  deploy_web:
    name: Build & Deploy Web Preview to GitHub Pages
    needs: test_and_analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Copy RSS Feed for App Updates
        run: |
          cp feed.xml build/web/feed.xml

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
